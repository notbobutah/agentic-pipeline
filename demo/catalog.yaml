# Event types this demo may publish (docs/demo §5). The event store rejects any
# other type — the catalog gate (H-PLT-01). Every entry also exists in the full
# catalog (docs/04, docs/catalog/*.yaml).
version: 0.1.0
types:
  work:
    - ap.work.item.assigned.v1
    - ap.work.item.commented.v1
    - ap.work.request.received.v1
    - ap.work.request.accepted.v1
    - ap.work.request.rejected.v1
    - ap.work.guidance.provided.v1
    - ap.work.repos.resolved.v1
    - ap.work.plan.requested.v1
    - ap.work.plan.proposed.v1
    - ap.work.plan.revision.requested.v1
    - ap.work.plan.approved.v1
    - ap.work.plan.rejected.v1
    - ap.work.plan.deviation.detected.v1
    - ap.work.blocked.v1
    - ap.work.completed.v1
    - ap.work.cancelled.v1
  command:
    - ap.command.received.v1
    - ap.command.accepted.v1
    - ap.command.rejected.v1
  devsession:
