# Demo deployment configuration (docs/demo §4).
tenant: demo
team: demo
stateDir: .ap                    # event log + agent task workdirs (gitignored)
agentUser: pipeline-agent        # the "Jira user" a card is assigned to
eligibleIssueTypes: [Story, Task, Bug]

identities:                      # tracker user → GitHub login; only these may guide/approve
  rob: { github: notbobutah }

components:                      # Jira component → repo + scope envelope ceiling
  data:
    repo: notbobutah/PGDataLayer
    root: .
    paths: ["**"]
    forbidden: [".github/**", ".agentic/**"]
    checks: [pgdatalayer]
    innerLoop: ["npm ci", "npm test", "npm run check --if-present"]
  web:
    repo: notbobutah/GoReactChat
    root: web
    paths: ["web/**"]
    forbidden: [".github/**", ".agentic/**", "server/**", "deploy/**", "migrations/**", "proto/**"]
    checks: [web-ci, "web (Next.js client)"]
    innerLoop: ["cd web && npm ci", "cd web && npm run lint", "cd web && npm run typecheck", "cd web && npm test --if-present", "cd web && npm run build"]
    dependsOn:
      data: { package: pgdatalayer, spec: "github:notbobutah/PGDataLayer#{sha}" }
    deploy: deploy-dev.yml

dependencyOrder: [data, web]     # producer first: merge order and version pinning

agents:
  image: ap-sandbox:node24
  model: claude-opus-5-5
  auth: api-key                  # api-key (ANTHROPIC_API_KEY) | claude-login (~/.claude/.credentials.json)
  roles:
    implementation-planner: { maxTurns: 60, maxBudgetUsd: 4 }
    test-author:            { maxTurns: 80, maxBudgetUsd: 4 }
    coding:                 { maxTurns: 150, maxBudgetUsd: 10 }
    coding-fix:             { maxTurns: 80, maxBudgetUsd: 5 }

sessions:
  maxIterations: 5               # outer-loop fixes before escalating to the sponsor
  reviewers: [notbobutah]        # GitHub users asked to review when a changeset is ready

feed:                            # public JSON snapshots for the /pipeline page
  repo: notbobutah/agentic-pipeline
  branch: feed
