# Demo deployment configuration (docs/demo §4).
tenant: demo
team: demo
stateDir: .ap                    # event log + agent task workdirs (gitignored)
agentUser: pipeline-agent        # the "Jira user" a card is assigned to
eligibleIssueTypes: [Story, Task, Bug]

identities:                      # tracker user → GitHub login (+ Jira account ID); only these may guide/approve
  rob: { github: notbobutah }     # add jira: <accountId> (`ap jira whoami`) to sponsor from Jira

components:                      # Jira component → repo + scope envelope ceiling
  data:
    repo: notbobutah/PGDataLayer
    root: .
    paths: ["**"]
    forbidden: [".github/**", ".agentic/**"]
    checks: [pgdatalayer]
    innerLoop: ["npm ci", "npm test", "npm run check --if-present"]
  api:
    repo: notbobutah/GoReactChat
    root: server
    paths: ["server/**"]
    forbidden: [".github/**", ".agentic/**", "web/**", "deploy/**", "migrations/**", "proto/**", "server/gen/**"]
    checks: ["lumid (Go backend)"]
    innerLoop: ["cd server && go build ./...", "cd server && go vet ./...", "cd server && go test ./..."]
  web:
    repo: notbobutah/GoReactChat
    root: web
    paths: ["web/**"]
    forbidden: [".github/**", ".agentic/**", "server/**", "deploy/**", "migrations/**", "proto/**"]
    checks: [web-ci, "web (Next.js client)"]
    innerLoop: ["cd web && npm ci", "cd web && npm run lint", "cd web && npm run typecheck", "cd web && npm test --if-present", "cd web && npm run build"]
    dependsOn:
      data: { package: pgdatalayer, spec: "github:notbobutah/PGDataLayer#{sha}" }
    deploy: deploy-dev.yml

dependencyOrder: [data, api, web] # producer first: merge order and version pinning

agents:
  image: ap-sandbox:node24
  model: claude-opus-5-5
  auth: api-key                  # api-key (ANTHROPIC_API_KEY) | claude-login (~/.claude/.credentials.json)
  roles:
    implementation-planner: { maxTurns: 60, maxBudgetUsd: 4 }
    test-author:            { maxTurns: 80, maxBudgetUsd: 4 }
    coding:                 { maxTurns: 150, maxBudgetUsd: 10 }
    coding-fix:             { maxTurns: 80, maxBudgetUsd: 5 }

sessions:
  maxIterations: 5               # outer-loop fixes before escalating to the sponsor
  reviewers: [notbobutah]        # GitHub users asked to review when a changeset is ready

feed:                            # public JSON snapshots for the /pipeline page
  repo: notbobutah/agentic-pipeline
  branch: feed

jira:                            # Jira Cloud watcher; off while site is empty. Every key has an AP_JIRA_* override.
  site: ""                       # https://<name>.atlassian.net (AP_JIRA_SITE)
  triggerLabel: ap-agent         # pick up open issues with this label (AP_JIRA_TRIGGER_LABEL)
  agentAccountId: ""             # or by assignee when triggerLabel is empty (AP_JIRA_AGENT_ACCOUNT)
  projects: []                   # project keys, e.g. [KAN] (AP_JIRA_PROJECTS)
  acceptanceCriteriaField: ""    # customfield_NNNNN; empty = "Acceptance criteria" section of the description
  pollSeconds: 30
  # Labels named after a component (data, web, api) select repos, as Jira components do.
  # Jira account IDs for identities: AP_JIRA_IDENTITIES=rob=<accountId>.
  # Credentials: AP_JIRA_EMAIL + AP_JIRA_TOKEN in the environment, never here.
